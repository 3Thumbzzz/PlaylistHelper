name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PlaylistHelper-Windows
            file: dist/PlaylistHelper.exe
          - os: macos-latest  # Apple Silicon (M1 and newer)
            artifact: PlaylistHelper-macOS-AppleSilicon
            file: dist/PlaylistHelper.dmg
          - os: macos-15-intel  # Intel Macs
            artifact: PlaylistHelper-macOS-Intel
            file: dist/PlaylistHelper.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements.txt pyinstaller
      # The runner is a newer macOS than many users have, so pip would pick wheels built
      # for it (numpy's arm64 wheel needs macOS 14). Only take wheels that run on macOS 12,
      # the app's minimum (MIN_MACOS in build.py).
      - name: Install requirements (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip download -r requirements.txt pyinstaller --only-binary=:all: --platform "macosx_12_0_$(uname -m)" -d wheels
          python -m pip install --no-index --find-links wheels -r requirements.txt pyinstaller
      - run: python build.py

      # Run the packaged app's self-test on a clean machine with no DJ software.
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist/PlaylistHelper.exe -ArgumentList '--selftest', 'selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          exit $p.ExitCode
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: dist/PlaylistHelper.app/Contents/MacOS/PlaylistHelper --selftest selftest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  # Keep one always-current "latest" release with the newest .exe and .dmg files.
  # Only runs when every build (and its self-test) succeeded.
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Name the files per platform
        run: |
          mkdir release
          cp artifacts/PlaylistHelper-Windows/PlaylistHelper.exe release/PlaylistHelper-Windows.exe
          cp artifacts/PlaylistHelper-macOS-AppleSilicon/PlaylistHelper.dmg release/PlaylistHelper-macOS-AppleSilicon.dmg
          cp artifacts/PlaylistHelper-macOS-Intel/PlaylistHelper.dmg release/PlaylistHelper-macOS-Intel.dmg
      - name: Point the "latest" tag at this commit
        run: |
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true \
            || gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA"
      - name: Publish the release
        run: |
          cat > notes.md <<EOF
          Newest build of \`main\` (commit ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M UTC')). This release is replaced on every push.

          | Download | For |
          |---|---|
          | **PlaylistHelper-Windows.exe** | Windows 10/11. Just run it. If SmartScreen warns, click *More info → Run anyway*. |
          | **PlaylistHelper-macOS-AppleSilicon.dmg** | Macs with M1 or newer |
          | **PlaylistHelper-macOS-Intel.dmg** | Older Intel Macs |

          **Mac:** open the .dmg and drag PlaylistHelper to Applications. The app is unsigned, so the first time, right-click it and choose *Open*. On macOS 15 or newer, try to open it once, then go to *System Settings → Privacy & Security → Open Anyway*. Allow access to Documents, Music and external drives when asked, so it can read your DJ libraries.
          EOF
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Latest build" --notes-file notes.md --latest
          else
            gh release create latest --title "Latest build" --notes-file notes.md --latest
          fi
          gh release upload latest release/* --clobber
